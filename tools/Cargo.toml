[package]
name = "agent-tools"
version = "0.1.0"
edition = "2021"
publish = false
description = "CLI tools used by the agent-config skills (SEO audit, Lighthouse runner, web adapter detection)."

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
roxmltree = "0.21.2"
scraper = "0.29.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = "3.5.1"
url = "2.5.8"

[profile.release]
strip = true
