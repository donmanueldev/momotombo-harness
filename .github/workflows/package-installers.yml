name: package-installers

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-installer
            os: macos-latest
            qt_target: desktop
            qt_arch: clang_64
            cpack_pattern: "*.dmg"
          - name: windows-installer
            os: windows-latest
            qt_target: desktop
            qt_arch: win64_msvc2022_64
            cpack_pattern: "*.exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          target: ${{ matrix.qt_target }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DREDISFORGE_FETCH_MISSING_DEPENDENCIES=ON

      - name: Build
        run: cmake --build build/release --config Release

      - name: Test
        run: ctest --test-dir build/release --output-on-failure -C Release

      - name: Package
        run: cpack --config build/release/CPackConfig.cmake --verbose -B build/packages

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/packages/${{ matrix.cpack_pattern }}
          if-no-files-found: error
