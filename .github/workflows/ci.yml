name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS matches the machines the harness is installed on (BSD userland, bash 3.2, /usr/bin/jq).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Bats and ShellCheck
        run: brew install bats-core shellcheck

      - name: ShellCheck
        run: shellcheck bin/harness global/hooks/*.sh global/claude/statusline.sh

      - name: Validate harness
        run: bin/harness validate

      - name: Bats suite
        run: bats tests/
