[agents]
max_threads = 6
max_depth = 1

[agents.specifier]
description = "Read-only specification lead for approved, testable requirements and traceability."
config_file = "agents/specifier.toml"

[agents.planner]
description = "Plan complex work, clarify scope, and route to specialist agents."
config_file = "agents/planner.toml"

[agents.web]
description = "Frontend specialist for React, Inertia.js, TypeScript, Tailwind CSS, and shadcn/ui."
config_file = "agents/web.toml"

[agents.backend]
description = "Backend specialist for Laravel/PHP, TypeScript, Java, and PostgreSQL."
config_file = "agents/backend.toml"

[agents.infra]
description = "Docker specialist for local environments and service dependencies."
config_file = "agents/infra.toml"

[agents.mobile]
description = "Mobile specialist for Expo, React Native, Kotlin/KMP, Jetpack Compose, Swift, and SwiftUI."
config_file = "agents/mobile.toml"

[agents.reviewer]
description = "Read-only reviewer for correctness, regressions, security, performance, and missing tests."
config_file = "agents/reviewer.toml"

[agents.orchestrator]
description = "Read-only orchestration lead for structured routing, evidence, and verification."
config_file = "agents/orchestrator.toml"

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."expo@openai-curated"]
enabled = true
